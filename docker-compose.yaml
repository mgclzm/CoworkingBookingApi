version: '5.1'

services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: postgres_container
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_db_data:/var/lib/postgresql
    networks:
      - backend
  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: pgadmin
    ports:
      - "${PGADMIN_PORT:-80}:80"
    environment:
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
      - PGADMIN_DEFAULT_LOGIN=${PGADMIN_DEFAULT_LOGIN}

    env_file:
      - .env
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - backend
    depends_on:
      - postgres
  main-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: main-app
    ports:
      - "${API_PORT:-8000}:8000"
    command: "uv run uvicorn --factory api.app.app:init_app --reload --host 0.0.0.0 --port 8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - postgres
    networks:
      - backend

volumes:
  pgadmin_data:
  postgres_db_data:
    driver: local

networks:
  backend:
    driver: bridge
